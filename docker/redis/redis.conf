# ReplyBase — Redis production configuration
# Mounted into the Redis container at /usr/local/etc/redis/redis.conf
# Applied via: redis-server /usr/local/etc/redis/redis.conf

# ── Memory ────────────────────────────────────────────────────────────────────
# Hard cap: prevents OOM-kills on shared DigitalOcean / Coolify hosts.
# allkeys-lru evicts the least-recently-used key across ALL keyspaces when the
# limit is reached — safe for BullMQ (job data is durable in DB; cache keys
# re-hydrate on next request) and rate-limit counters (stale keys drop, new
# ones are created). Do NOT use volatile-lru here: BullMQ keys have no TTL, so
# volatile-lru would never evict them and the cap would be ineffective.
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Persistence ───────────────────────────────────────────────────────────────
# AOF persistence: writes are fsynced every second.  Tolerates at most ~1 s of
# data loss on crash, which is acceptable for BullMQ (jobs re-enqueue on boot)
# and rate-limit counters (brief reset is acceptable).
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshot as a safety net (not primary durability mechanism).
save 900 1
save 300 10
save 60 10000

# ── Network & security ────────────────────────────────────────────────────────
# Bind only to container-internal interface; Coolify network isolation handles
# external access restrictions.
bind 0.0.0.0
protected-mode no

# ── Performance ───────────────────────────────────────────────────────────────
# Lazy freeing: large key deletions happen in a background thread so they don't
# block the event loop (important when BullMQ removes completed job batches).
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Keep client output buffers generous for BullMQ workers pushing large payloads.
# normal: unlimited; slave: 256mb hard / 64mb soft; pubsub: 32mb hard / 8mb soft
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ── Logging ───────────────────────────────────────────────────────────────────
loglevel notice
